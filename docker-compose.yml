services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: db_esport
      MYSQL_USER: esport_user
      MYSQL_PASSWORD: 4nakpadan7
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    ports: 
      - "9999:9999"
      - "5555:5555"
    env_file: .env
    volumes:
      - ./assets:/app/assets
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: